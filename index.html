let deck=[],seen=[],pos=-1,revealed=false,selected={},typed={},remaining=60,interval=null;
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function card(){return CARDS[seen[pos]]}
function render(){const c=card();$('title').textContent=c.emoji+' '+c.scene+' – '+c.title;$('scene').textContent='ตัวอย่างการ์ด · '+c.thai+' · Deutsch mit Monmanat';$('count').textContent='Karte '+(pos+1)+' / 50';$('status').textContent=deck.length+' Karten übrig';$('tasks').innerHTML=c.tasks.map((t,i)=>`<div class="task"><div class="question">${i+1}. ${escapeHTML(t.q)}</div><div class="thai">🇹🇭 ${escapeHTML(t.th)}</div>${t.kind==='choice'?t.opts.map((o,j)=>`<label class="option ${revealed?(o===t.answer?'correct':selected[i]===j?'wrong':''):''}"><input type="radio" name="q${i}" value="${j}" ${selected[i]===j?'checked':''} onchange="selected[${i}]=${j}"><span>${'ABC'[j]}. ${escapeHTML(o)}</span></label>`).join(''):`<textarea class="write" placeholder="Schreibe den richtigen Satz ..." oninput="typed[${i}]=this.value">${escapeHTML(typed[i]||'')}</textarea>`}<div class="hint">💡 Hilfewörter: ${escapeHTML(t.hint)}</div>${revealed?`<div class="answer"><b>✓ ${escapeHTML(t.answer)}</b><div>🇹🇭 ${escapeHTML(t.why)}</div></div>`:''}<button class="read" onclick="readTask(${i})">🔊 Satz vorlesen</button></div>`).join('');$('reveal').textContent=revealed?'🙈 ซ่อนเฉลย':'👁️ เฉลย anzeigen';resetTimer()}
function toggleAnswers(){revealed=!revealed;render()}
function nextCard(){if(pos<seen.length-1){pos++;}else if(deck.length){seen.push(deck.pop());pos++}else{alert('ครบ 50 การ์ดแล้วค่ะ! กด Neu mischen เพื่อเริ่มใหม่');return}revealed=false;selected={};typed={};render()}
function previous(){if(pos>0){pos--;revealed=false;selected={};typed={};render()}}
function reshuffle(){if(!confirm('เริ่มสุ่มใหม่ทั้งหมด 50 การ์ด?'))return;deck=shuffle(Array.from({length:CARDS.length},(_,i)=>i));seen=[];pos=-1;nextCard()}
function read(s){if(!('speechSynthesis' in window)){alert('เบราว์เซอร์นี้ไม่รองรับเสียงอ่าน');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='de-DE';u.rate=.87;speechSynthesis.speak(u)}
function spoken(t){if(t.kind==='write')return t.answer;return t.q.replace(/_{2,}|—|___/g,t.answer)}
function readTask(i){read(spoken(card().tasks[i]))}
function readAll(){read(card().tasks.map(spoken).join('. '))}
function clock(){const m=Math.floor(remaining/60),s=remaining%60;$('clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function resetTimer(){if(interval)clearInterval(interval);interval=null;remaining=Number($('duration').value);clock();$('timerBtn').textContent='▶ Start'}
function timerToggle(){if(interval){clearInterval(interval);interval=null;$('timerBtn').textContent='▶ Weiter';return}if(remaining<=0)remaining=Number($('duration').value);$('timerBtn').textContent='⏸ Pause';interval=setInterval(()=>{remaining--;clock();if(remaining<=0){clearInterval(interval);interval=null;$('timerBtn').textContent='↻ Neustart';try{new AudioContext().resume()}catch(e){} }},1000)}
deck=shuffle(Array.from({length:CARDS.length},(_,i)=>i));nextCard();
